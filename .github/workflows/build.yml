name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на ubuntu-latest (ANDROID_HOME), отдельный шаг
      # android-actions/setup-android не нужен и падает на пакете "tools".
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Test step detector (simulated signals)
        run: |
          mkdir -p out1
          javac -d out1 app/src/main/java/com/stepcounter/app/StepDetector.java tools/SimTest.java
          java -cp out1 SimTest

      - name: Test commitment core (penalties, ledger)
        run: |
          mkdir -p out2
          P=app/src/main/java/com/stepcounter/app
          javac -encoding UTF-8 -d out2 $P/StepSource.java $P/Commitment.java $P/Ledger.java $P/PaymentProvider.java $P/VirtualVault.java $P/Settler.java $P/Fmt.java $P/Calories.java $P/Plan.java $P/FoodBook.java $P/Calibration.java tools/com/stepcounter/app/CoreTest.java
          java -cp out2 com.stepcounter.app.CoreTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Show signing certificate (должен быть одинаковым у всех сборок)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: StepCounter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
